<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-md mx-auto mt-7 mb-7 bg-white p-6 rounded-lg shadow-md">

        <!-- Heading -->
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-1">
            Student Registration Form
        </h2>

        <p class="text-center text-xs text-gray-600 mb-5">
            Tushar Thombre | USN-CD25121
        </p>

        <form id="registrationForm">

            <!-- Student Name -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Student Name <span class="text-red-500">*</span>
            </label>

            <input type="text" id="name" placeholder="Enter your name"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Email -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Email <span class="text-red-500">*</span>
            </label>

            <input type="text" id="email" placeholder="Enter your email"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Password -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Password <span class="text-red-500">*</span>
            </label>

            <div class="flex gap-1 mb-3">

                <input type="password" id="password" placeholder="Enter password"
                    class="flex-1 border border-gray-300 rounded-md px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">

                <button type="button" onclick="togglePassword()"
                    class="bg-slate-600 text-white px-3 rounded-md text-xs font-semibold" id="passwordBtn">
                    Show Password
                </button>

            </div>


            <!-- Mobile Number -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Mobile Number <span class="text-red-500">*</span>
            </label>

            <input type="text" id="mobile" placeholder="Enter mobile number"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Date of Birth -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Date of Birth <span class="text-red-500">*</span>
            </label>

            <input type="date" id="dob"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Parent / Guardian -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Parent / Guardian Name <span class="text-red-500">*</span>
            </label>

            <input type="text" id="guardian" placeholder="Enter parent / guardian name"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Current Address -->
            <h3 class="text-blue-700 font-bold text-sm mb-3 border-b border-gray-300 pb-2">
                Current Address
            </h3>


            <!-- Street Address -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Street Address <span class="text-red-500">*</span>
            </label>

            <input type="text" id="street" placeholder="Enter street address"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- Address Line 2 -->
            <label class="block text-xs font-semibold text-gray-800 mb-1">
                Street Address Line 2
            </label>

            <input type="text" id="address2" placeholder="Enter address line 2"
                class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">


            <!-- City and State -->
            <div class="grid grid-cols-2 gap-3">

                <div>
                    <label class="block text-xs font-semibold text-gray-800 mb-1">
                        City <span class="text-red-500">*</span>
                    </label>

                    <input type="text" id="city" placeholder="City"
                        class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>


                <div>
                    <label class="block text-xs font-semibold text-gray-800 mb-1">
                        Region / State <span class="text-red-500">*</span>
                    </label>

                    <input type="text" id="state" placeholder="State"
                        class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>

            </div>


            <!-- ZIP and Country -->
            <div class="grid grid-cols-2 gap-3">

                <div>
                    <label class="block text-xs font-semibold text-gray-800 mb-1">
                        Postal / ZIP Code <span class="text-red-500">*</span>
                    </label>

                    <input type="text" id="zip" placeholder="ZIP Code"
                        class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>


                <div>
                    <label class="block text-xs font-semibold text-gray-800 mb-1">
                        Country <span class="text-red-500">*</span>
                    </label>

                    <select id="country"
                        class="w-full bg-blue-50 border border-gray-300 rounded-md px-2 py-2 mb-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">

                        <option value="">Select Country</option>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Canada">Canada</option>

                    </select>
                </div>

            </div>


            <!-- Register Button -->
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md text-xs transition">
                Register
            </button>


            <!-- Message -->
            <p id="message" class="mt-4 text-center text-xs font-semibold"></p>

        </form>

    </div>


    <!-- JavaScript -->
    <script>

        // Show / Hide Password
        function togglePassword() {

            let password = document.getElementById("password");
            let button = document.getElementById("passwordBtn");

            if (password.type === "password") {

                password.type = "text";
                button.innerHTML = "Hide Password";

            } else {

                password.type = "password";
                button.innerHTML = "Show Password";

            }
        }


        // Form Validation
        document.getElementById("registrationForm").onsubmit = function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value.trim();

            let dob = document.getElementById("dob").value;
            let guardian = document.getElementById("guardian").value.trim();

            let street = document.getElementById("street").value.trim();
            let city = document.getElementById("city").value.trim();
            let state = document.getElementById("state").value.trim();
            let zip = document.getElementById("zip").value.trim();
            let country = document.getElementById("country").value;

            let message = document.getElementById("message");


            // Required fields
            if (
                name === "" ||
                email === "" ||
                password === "" ||
                mobile === "" ||
                dob === "" ||
                guardian === "" ||
                street === "" ||
                city === "" ||
                state === "" ||
                zip === "" ||
                country === ""
            ) {

                message.innerHTML = "Please fill all required fields.";
                message.className =
                    "mt-4 text-center text-xs font-semibold text-red-500";

                return;
            }


            // Email validation
            if (!email.includes("@") || !email.includes(".")) {

                message.innerHTML = "Enter a valid email.";
                message.className =
                    "mt-4 text-center text-xs font-semibold text-red-500";

                return;
            }


            // Password validation
            if (password.length < 6) {

                message.innerHTML =
                    "Password must be at least 6 characters.";

                message.className =
                    "mt-4 text-center text-xs font-semibold text-red-500";

                return;
            }


            // Mobile validation
            if (mobile.length !== 10 || isNaN(mobile)) {

                message.innerHTML =
                    "Enter a valid 10-digit mobile number.";

                message.className =
                    "mt-4 text-center text-xs font-semibold text-red-500";

                return;
            }


            // ZIP validation
            if (zip.length !== 6 || isNaN(zip)) {

                message.innerHTML =
                    "Enter a valid 6-digit ZIP code.";

                message.className =
                    "mt-4 text-center text-xs font-semibold text-red-500";

                return;
            }


            // Success
            message.innerHTML = "Registration Successful!";

            message.className =
                "mt-4 text-center text-xs font-semibold text-green-500";

        };

    </script>

</body>

</html>
